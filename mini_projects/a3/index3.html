<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <link rel="stylesheet" href="style3.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-watermarks">
        <div class="watermark-game">GAME</div>
        <div class="watermark-squid">SQUID</div>
    </div>
    
    <nav>
        <div class="logo">
            <span class="logo-shapes">
                <span class="circle"></span>
                <span class="triangle"></span>
                <span class="square"></span>
            </span>
            <span class="logo-text">SQUID<br>GAME</span>
        </div>
        
        <ul class="nav-links">
            <li><a href="#">About</a></li>
            <li><a href="#" class="active">Watch now</a></li>
            <li><a href="#">Actors</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        
        <div class="menu-btn">
            <span class="material-symbols-outlined">menu</span>
        </div>
    </nav>

    <div class="main-content">
        <div class="left-section">
            <div class="hero-logo">
                <div class="hero-logo-row">
                    <span class="hero-line"></span>
                    <h1>SQUID</h1>
                    <span class="star-icon"></span>
                </div>
                <div class="hero-logo-row">
                    <span class="star-icon yellow"></span>
                    <h1>GAME</h1>
                    <span class="hero-line-long"></span>
                </div>
            </div>
            
            <p class="description">Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>Season 1: 9 Episodes</p>
            
            <div class="buttons">
                <button class="btn-play">
                    <span class="material-symbols-outlined">play_circle</span>
                    Play Now
                </button>
                <button class="btn-trailer">
                    <span class="material-symbols-outlined">play_arrow</span>
                    Watch Trailer
                </button>
            </div>
        </div>

        <div class="scroll-indicator">
            <span>SCROLL</span>
            <div class="line"></div>
        </div>

        <div class="right-section">
            <div class="hero-image-wrapper">
                <img src="images/hero_guard.png" alt="Guard" class="hero-image">
            </div>
            
            <div class="social-links">
                <a href="#"><span class="material-symbols-outlined">alternate_email</span></a>
                <a href="#"><span class="material-symbols-outlined">photo_camera</span></a>
                <a href="#"><span class="material-symbols-outlined">facebook</span></a>
            </div>
        </div>
    </div>

    <div class="cards-section">
        <div class="cards-container">
            <div class="card">
                <img src="images/card_1.png" alt="Episode 1">
                <div class="play-btn">
                    <span class="material-symbols-outlined">play_arrow</span>
                </div>
            </div>
            <div class="card">
                <img src="images/card_2.png" alt="Episode 2">
                <div class="play-btn">
                    <span class="material-symbols-outlined">play_arrow</span>
                </div>
            </div>
            <div class="card">
                <img src="images/card_3.png" alt="Episode 3">
                <div class="play-btn">
                    <span class="material-symbols-outlined">play_arrow</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
