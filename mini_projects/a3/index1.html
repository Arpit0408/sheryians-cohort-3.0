<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Art Work</title>
    <link rel="stylesheet" href="style1.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-dots">
      <div class="dot dot-left-1"></div>
      <div class="dot dot-left-2"></div>
      <div class="dot dot-right-1"></div>
      <div class="dot dot-right-2"></div>
    </div>

    <div class="container">
      <header>
        <h1>Explore Art Work</h1>
        <a href="#" class="see-all">See All</a>
      </header>

      <div class="grid">
        <div class="card">
          <div class="img-container">
            <img src="images/monocular.png" alt="Monocular">
          </div>
          <div class="info">
            <span class="title">Monocular</span>
            <div class="likes">
              <span class="count">54.8k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>

        <div class="card">
          <div class="img-container">
            <img src="images/horns_mask.png" alt="Horns Mask">
          </div>
          <div class="info">
            <span class="title">Horns Mask</span>
            <div class="likes">
              <span class="count">32.4k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>

        <div class="card">
          <div class="img-container">
            <img src="images/light_moon.png" alt="Light Moon">
          </div>
          <div class="info">
            <span class="title">Light Moon</span>
            <div class="likes">
              <span class="count">86.6k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>

        <div class="card">
          <div class="img-container">
            <img src="images/skull_wire.png" alt="Skull Wire">
          </div>
          <div class="info">
            <span class="title">Skull Wire</span>
            <div class="likes">
              <span class="count">78.9k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>

        <div class="card">
          <div class="img-container">
            <img src="images/spiderman.png" alt="Spiderman">
          </div>
          <div class="info">
            <span class="title">Spiderman</span>
            <div class="likes">
              <span class="count">24.8k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>

        <div class="card">
          <div class="img-container">
            <img src="images/deadpool.png" alt="DeadPool">
          </div>
          <div class="info">
            <span class="title">DeadPool</span>
            <div class="likes">
              <span class="count">59.7k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>

        <div class="card">
          <div class="img-container">
            <img src="images/white_eye.png" alt="White Eye">
          </div>
          <div class="info">
            <span class="title">White Eye</span>
            <div class="likes">
              <span class="count">45.7k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>

        <div class="card">
          <div class="img-container">
            <img src="images/plastic_spinal.png" alt="Plastic Spinal">
          </div>
          <div class="info">
            <span class="title">Plastic Spinal</span>
            <div class="likes">
              <span class="count">98.6k</span>
              <span class="material-symbols-outlined icon">favorite</span>
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>
    </div>
  </body>
</html>
